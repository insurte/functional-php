name: Test

on: [push, pull_request]

jobs:
  test:
    name: PHP ${{ matrix.php-version }} (${{ matrix.experimental && 'experimental' || 'full support' }})

    runs-on: ubuntu-18.04

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - 7.1
          - 7.2
          - 7.3
          - 7.4
          - 8.0
        experimental: [false]
        include:
          - php-version: 8.1
            experimental: true

    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # ratchet:shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@994bb194a4fefcf39449ccf0f7766a4318f1ac76 # ratchet:ramsey/composer-install@v1
        with:
          composer-options: --prefer-dist
        continue-on-error: ${{ matrix.experimental }}

      - name: Setup PCOV
        run: |
          composer require pcov/clobber
          vendor/bin/pcov clobber
        continue-on-error: true

      - name: Run Tests
        run: composer tests
        continue-on-error: ${{ matrix.experimental }}

      - name: Check coding style
        run: composer coding-style
        continue-on-error: ${{ matrix.experimental }}
